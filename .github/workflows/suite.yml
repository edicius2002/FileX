name: suite

# Los módulos de prueba que un runner de Linux PUEDE ejecutar, medidos uno a uno
# con `ci/sonda_linux.py` y congelados en `ci/linux-apto.json`.
#
# **7 de 17 módulos · 198 pruebas · 3,4 s**, MEDIDO EN EL RUNNER. Los diez que
# faltan NO se ejecutan y hay que decir por qué, o el verde miente:
#
#   CUELGA   test_cancelacion -- se duerme y agota el tope. Lanzar la suite
#            entera se queda dormida sin decir en qué módulo: quemaría el runner
#            y devolvería un rojo que no nombra nada.
#   FALLAN   test_a7_ciego, test_cancelacion_procesos, test_cerrojo,
#            test_gpu_lock, test_hito1, test_hito2, test_hito4, test_hito7,
#            test_watcher_n -- piden tarjeta, motores, contenedores, o NTFS.
#
# Y la lista **no se puede medir en la máquina del proyecto**: allí, en WSL2
# sobre DrvFs con Python 3.14, salen 11 aptos y 262 pruebas, y los mismos once
# aquí dan 23 fallos y 7 errores. De las dos listas -- 11 y 7 -- sólo
# coinciden CINCO módulos. Trampa 104.
#
# **Y ninguno de los once lee `corpus/`** -- comprobado, no supuesto. Por eso
# `lfs: false` es seguro por construcción y no por suerte: la cuota gratuita de
# LFS es de 1 GB de ancho de banda AL MES y el corpus pesa 254 MB.
#
# Esto NO sustituye a la suite del proyecto: las pruebas `win32`, la GPU y los
# contenedores locales sólo corren en la máquina. Ver CONTRIBUTING.md §1.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Lunes a las 04:00 UTC: el trabajo de deriva, que vuelve a medir la lista.
    - cron: '0 4 * * 1'

permissions:
  contents: read

concurrency:
  group: suite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    # BLOQUEA. Y hubo que ganárselo: durante dos ejecuciones llevó
    # `continue-on-error: true`, que a nivel de TRABAJO hace que el run entero
    # salga en VERDE con los dos trabajos en rojo. Es el falso verde contra el
    # que avisa CONTRIBUTING.md §1, construido dentro del flujo que lo avisaba.
    # Con la lista medida donde toca, ya no hace falta esconder nada.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # SÓLO 3.11, y no por comodidad. Con 3.13 en la matriz, `test_sondeo`
        # falla -- y tiene razón: la huella del código es función del INTÉRPRETE,
        # no sólo del código, porque `ast.dump` cambia entre versiones. Mismo
        # runner, mismos bytes, 3.11 verde y 3.13 con las aristas de los siete
        # motores caducadas. Meter 3.13 aquí no probaría compatibilidad: sólo
        # dejaría la CI roja por un sellado que es correcto. Trampa 105, C43.
        python: ['3.11']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          lfs: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: ${{ matrix.python }}

      - name: Declarar el intérprete y el entorno
        run: |
          python3 -VV
          echo "plataforma: $(python3 -c 'import sys; print(sys.platform)')"
          echo "docker:     $(command -v docker || echo AUSENTE)"
          echo "ffmpeg:     $(command -v ffmpeg || echo AUSENTE)"

      - name: El paquete importa y la CLI arranca
        run: |
          python3 -c "import filex; print('filex', filex.__file__)"
          python3 -m filex motores

      - name: Los módulos declarados APTOS
        run: |
          MODULOS=$(python3 -c "import json; print(' '.join('pruebas.'+m for m in json.load(open('ci/linux-apto.json'))['aptos']))")
          echo "ejecutando: $MODULOS"
          python3 -m unittest $MODULOS

  deriva:
    # Vuelve a MEDIR qué es apto, en el runner de verdad. `ci/linux-apto.json`
    # se midió en WSL2 sobre DrvFs con Python 3.14, y la trampa 41 es explícita:
    # un resultado de una familia de sistemas de ficheros no se extrapola a otra,
    # ni con el signo.
    #
    # Este trabajo FALLA cuando la lista se mueve, y no siempre fue así: con
    # `continue-on-error: true` y un paso que sólo imprimía, la deriva quedó
    # invisible desde el 01/09 -- `ci/linux-apto.json` declaraba 7 módulos
    # mientras el runner medía 16, así que la CI ejecutaba 7 de 18 y nadie lo
    # sabía. Es la trampa 110 hasta el final: un check sólo protege si alguien
    # lo mira, y un check que no puede ponerse rojo no se mira nunca.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          lfs: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: '3.11'

      - name: Medir módulo a módulo, con tope
        run: python3 ci/sonda_linux.py --tope 90 --json /tmp/linux-apto-runner.json

      - name: ¿Se ha movido la lista?
        run: |
          python3 - <<'EOF'
          import json, sys
          congelada = set(json.load(open("ci/linux-apto.json"))["aptos"])
          medida = set(json.load(open("/tmp/linux-apto-runner.json"))["aptos"])
          if congelada == medida:
              print("sin deriva: %d módulos" % len(medida))
              sys.exit(0)
          perdidos = sorted(congelada - medida)
          nuevos = sorted(medida - congelada)
          print("DERIVA -- regenera ci/linux-apto.json desde el artefacto de ESTA ejecución")
          print("  ya no son aptos: %s" % perdidos)
          print("  aptos nuevos:    %s" % nuevos)
          # Las dos direcciones son fallo, y por motivos distintos. Perder un
          # módulo es una regresión. Ganarlo también hay que atenderlo: mientras
          # no entre en el fichero, el trabajo `linux` NO LO EJECUTA, así que la
          # lista vieja es cobertura que se está perdiendo en silencio.
          sys.exit(1)
          EOF

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: linux-apto-runner
          path: /tmp/linux-apto-runner.json
